name: thapar-ams
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: thapar_ams
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/start-postgres.ps1 first}
      AMS_DB_PASSWORD: ${DB_PASSWORD:?Run scripts/start-postgres.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thapar_ams"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
