logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/thapar_ams?currentSchema=academic}
    username: ${DB_USER:ams}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/postgresql
    default-schema: academic
    schemas: academic
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: academic
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
---
spring:
  config:
    activate:
      on-profile: production
server:
  servlet:
    session:
      cookie:
        secure: true
